[tools]
go = "1.27.4"
prek = "latest"

[hooks]
postinstall = "prek install"

[tasks.help]
alias = "default"
description = "📖 Show what's available (You are looking at it 😎)"
run = """
    # mise tasks
    echo "    _______                __        _______                   "
    echo "   |   |   |.-----.----.--|  |.----.|_     _|.---.-.-----.-----."
    echo "   |       ||  -__|   _|  _  |  _| |  |   |  |  _  |  _  |__ --|"
    echo "   |___|___||_____|__| |_____|__|   |___|  |___._|___  |_____|"
    echo "                                                  |_____|      "
    mise ls --local
    echo
    mise tasks --local
"""

[tasks.build]
description = "🔨 Build the plugin binary into bin/"
run = "go build -o bin/herdr-tags ."

[tasks.test]
description = "🧪 Run the test suite"
run = "go test ./..."

[tasks.publish]
alias = "push"
description = "🚀 Publish to GitHub"
run = ["git push", "git push --tags"]
